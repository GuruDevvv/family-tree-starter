# ---- Зарубежные архивы бывшей Российской империи. Сведения проверены в октябре 2026: перед письмом сверить на сайте архива.

- id: lvva
  name: Латвийский государственный исторический архив (Latvijas Valsts vēstures arhīvs)
  short: LVVA
  region: Рига, Латвия
  address: Slokas iela 16, Rīga, LV-1048
  url: https://raduraksti.arhivi.lv
  holds: Метрические книги всех конфессий Латвии до 1920 г., в т. ч. раввинатов (Двинск/Даугавпилс и др.); ревизские сказки. Сканы метрик — на портале Raduraksti после регистрации
  how_to_request: Бумажным письмом; по e-mail — только с латвийской электронной подписью. С 11.2020 не ведёт общий поиск, только копии конкретных записей (путеводители JewishGen)
  note: Адрес проверен 23.10.2026. Поддержка Raduraksti — raduraksti@arhivi.gov.lv. Аккаунт Raduraksti активируют не сразу — заводить заранее.

- id: dakho
  name: Державний архів Харківської області (Государственный архив Харьковской области)
  short: ДАХО (ГАХО)
  region: Харьков, Украина
  address: 61005, м. Харків, просп. Героїв Харкова, 7
  url: https://archives.kh.gov.ua/
  holds: Ф. Р-6452 «Список репресованих громадян» — уголовные дела реабилитированных 1920–1953 (около 30 тыс.), часть оцифрована; родословные книги Харьковской губ.
  how_to_request: E-mail d.arhiv@kharkivoda.gov.ua. Письма с адресов .ru не принимают — только gmail.com, ukr.net и т. п. Личный приём закрыт (военное положение), ответы почтой или на e-mail. В запросе — ФИО, почтовый адрес, телефон, суть вопроса; для генеалогических запросов — документы о родстве.
  note: >-
    Проверено 23.10.2026. Пример украинского облархива: по закону Украины № 316-VIII (2015), ст. 11, доступ к делам
    репрессивных органов — по документу и заявлению, копии в читальном зале бесплатно. Другие облархивы Украины
    (Черниговский, Киевский и т. д.) работают похоже; порядок каждого проверять на его сайте.

- id: niab
  name: Национальный исторический архив Беларуси (Минск)
  short: НИАБ
  region: Минск, Беларусь
  email: niab@niab.by
  url: https://niab.by/newsite/ru/zaprosy-i-uslugi
  holds: "Документы Минской, Могилёвской и части Витебской губ.: метрические книги разных конфессий, в т. ч. раввинатов, ревизские сказки, посемейные списки мещан"
  how_to_request: >-
    Заявление по образцу со страницы «Запросы и услуги» на имя директора, e-mail niab@niab.by: ФИО, постоянный адрес,
    суть запроса, гарантия оплаты; для поиска по семье — место, все известные члены семьи с годами, вера, сословие.
