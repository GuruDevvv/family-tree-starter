  holds: Ревизии 1–3 (1719–1767), ландратские книги (ф. 350), писцовые и переписные книги XVI–XVII вв., Разрядный приказ
  how_to_request: Сканы ф. 350 — через ГИС УИАД; иначе читальный зал или запрос

