# Справочник архивов. Адреса и почту добавлять только проверенные, с датой проверки в note.
# Региональные архивы добавляем по мере того, как появляются места предков.

- id: rosarchiv-gis
  name: ГИС «Удалённый доступ к архивным документам» (Росархив)
  short: ГИС УИАД
  holds: Сканы федеральных архивов (РГАДА, РГИА, РГВИА, ГАРФ), справочный аппарат 13 федеральных архивов
  price: Просмотр копий 90 ₽/час или 350 ₽/сутки; регистрация и справочный поиск бесплатно (постановление № 982 от 30.06.2025)
  note: Запущена 10.09.2025. Точный адрес портала не установлен — найти при первом поиске.

- id: rgada
